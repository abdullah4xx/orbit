<!doctype html><html lang="en"><head><title>Bookmarks</title><meta charset="utf-8"><link rel="stylesheet" href="orbit://ui/base.css"><link rel="stylesheet" id="theme" href="orbit://theme/current.css"><link rel="stylesheet" href="orbit://ui/page.css"><link rel="stylesheet" href="orbit://ui/bookmarks.css"></head><body>
<div class="layout">
  <aside><h2>Bookmarks</h2><div id="tree"></div>
    <div class="side-actions">
      <button class="btn small" id="newfolder">New folder</button>
      <button class="btn small" id="import">Import</button>
      <button class="btn small" id="export">Export</button>
      <input type="file" id="file" accept=".html,.htm" hidden>
    </div>
  </aside>
  <section>
    <div class="bar"><h1 id="title"></h1><input type="text" id="search" placeholder="Search bookmarks"></div>
    <div id="msg" class="muted small"></div>
    <div id="list"></div>
  </section>
</div>
<script src="orbit://ui/lib.js"></script><script src="orbit://ui/bookmarks.js"></script></body></html>
