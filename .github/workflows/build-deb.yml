name: Build .deb
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-browser-deb
          path: dist/*.deb
